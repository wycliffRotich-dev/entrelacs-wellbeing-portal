server {
  listen 8080;
  server_tokens off;
  client_max_body_size 64k;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # The backend is looked up when a request arrives, so this file is valid even when the backend is not running yet.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
