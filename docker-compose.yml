services:
  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_USER: wellbeing
      POSTGRES_DB: wellbeing
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellbeing -d wellbeing"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE_PATH:-./secrets/postgres_password}

volumes:
  pgdata:
